name: Manual Build

# 手动触发的打包流程：构建 Release 并用 Velopack 生成 Windows 安装文件。
#
# 打包必须人工放行：package job 绑定了带 Required reviewers 的 environment（packaging），
# 触发后会先跑测试，然后在真正打包前暂停，等你在 Actions 页面点 Approve 才继续。
# 审批规则配置在仓库 Settings -> Environments -> packaging。
#
# 注意：workflow_dispatch 要求该文件先存在于默认分支（main），
# Actions 页面才会出现「Run workflow」按钮；触发时可以选择任意分支。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（2~4 段纯数字，例如 2.0.11）'
        required: true
        default: '2.0.11'
        type: string
      run_tests:
        description: '打包前运行单元测试'
        required: false
        default: true
        type: boolean
      create_release:
        description: '创建草稿 Release 并上传安装文件'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # 第一阶段：校验版本号并按需跑测试。这一步不会产出任何安装文件。
  prepare:
    name: Prepare
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.clean }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # build.ps1 会把版本号写入 AssemblyVersion，因此必须是纯数字
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}" -replace '^v', ''
          if ($v -notmatch '^\d+(\.\d+){1,3}$') {
            Write-Error "版本号必须是 2~4 段纯数字（例如 2.0.11），当前值: $v"
            exit 1
          }
          "clean=$v" >> $env:GITHUB_OUTPUT
          Write-Host "打包版本: $v"

      # 排除依赖真实桌面/多显示器的 WPF 窗口动画测试：它们在无头 runner 上必然失败，
      # 与翻译逻辑无关，不能作为打包门槛；其余测试照常作为回归门槛。
      - name: Test
        if: ${{ inputs.run_tests }}
        run: >
          dotnet test src/Tests/STranslate.Tests/STranslate.Tests.csproj --configuration Release
          --filter "FullyQualifiedName!~WindowShowAnimationTests&FullyQualifiedName!~ModernWindowLifecycleTests"

  # 第二阶段：真正打包。绑定 environment 后，本 job 会在开始前暂停，等待人工批准。
  # 不批准就不会构建，也不会有安装文件产出。
  package:
    name: Package (manual approval required)
    needs: prepare
    runs-on: windows-latest
    environment: packaging
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Build and Pack
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          .\build.ps1 $env:VERSION
          .\post_build.ps1 -Version $env:VERSION -RepoUrl $env:REPO_URL

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: STranslate-${{ needs.prepare.outputs.version }}
          path: publish/*
          if-no-files-found: error
          retention-days: 30

      - name: Create draft release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          draft: true
          files: publish/*
