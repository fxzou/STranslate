name: Manual Build

# 手动触发的打包流程：校验版本号 -> 按需运行测试 -> 构建 Release 并用 Velopack 生成 Windows 安装文件。
#
# 触发这个工作流本身就是人工放行，因此不再附加额外的审批门禁：点 Run workflow 后直接跑完。
# 注意：workflow_dispatch 要求该文件先存在于默认分支（main），
# Actions 页面才会出现「Run workflow」按钮；触发时可以选择任意分支。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（2~4 段纯数字，例如 2.0.11）'
        required: true
        default: '2.0.11'
        type: string
      run_tests:
        description: '打包前运行单元测试'
        required: false
        default: true
        type: boolean
      create_release:
        description: '创建草稿 Release 并上传安装文件'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build & Pack
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # build.ps1 会把版本号写入 AssemblyVersion，因此必须是纯数字
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}" -replace '^v', ''
          if ($v -notmatch '^\d+(\.\d+){1,3}$') {
            Write-Error "版本号必须是 2~4 段纯数字（例如 2.0.11），当前值: $v"
            exit 1
          }
          "clean=$v" >> $env:GITHUB_OUTPUT
          Write-Host "打包版本: $v"

      # 排除依赖真实桌面/多显示器的 WPF 窗口动画测试：它们在无头 runner 上必然失败，
      # 与翻译逻辑无关，不能作为打包门槛；其余测试照常作为回归门槛。
      - name: Test
        if: ${{ inputs.run_tests }}
        run: >
          dotnet test src/Tests/STranslate.Tests/STranslate.Tests.csproj --configuration Release
          --filter "FullyQualifiedName!~WindowShowAnimationTests&FullyQualifiedName!~ModernWindowLifecycleTests"

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Build and Pack
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.clean }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          .\build.ps1 $env:VERSION
          .\post_build.ps1 -Version $env:VERSION -RepoUrl $env:REPO_URL

      # 只保留安装器：Velopack 产出的 nupkg / RELEASES / releases.win.json / Portable.zip 都不需要留存。
      # 代价是内置的自动更新检查与 delta 增量包不再可用（它们依赖 RELEASES + nupkg）。
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: STranslate-${{ steps.version.outputs.clean }}
          path: publish/STranslate-win-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create draft release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.clean }}
          name: v${{ steps.version.outputs.clean }}
          draft: true
          files: publish/STranslate-win-Setup.exe
